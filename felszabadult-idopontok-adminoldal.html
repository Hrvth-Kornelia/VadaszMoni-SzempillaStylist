<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Felszabadult időpontok</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#171717">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.12.1/font/bootstrap-icons.min.css">

<link id="main-css" rel="stylesheet" href="felszabadult-idopontok-adminoldal.css">
</head>

<body>

<header class="luxoria-header">

    <a href="index.html" class="home-button">
        <i class="bi bi-house"></i>
        <span>Főoldal</span>
    </a>

</header>

<main class="admin-oldal">

    <div class="admin-jelzes">
        ADMIN
    </div>

    <h1>
        Szabad időpontok
    </h1>

    <div class="arany-vonal"></div>

    <p class="admin-alcim">
        Új felszabadult időpont hozzáadása.
    </p>

    <section class="admin-kartya">

        <div class="uj-idopont-cimke">
            ÚJ IDŐPONT
        </div>

        <div class="idopont-mezok">

            <div class="mezo-blokk">

                <label for="datum">
                    DÁTUM RÖGZÍTÉS
                </label>

                <div class="input-keret">

                    <i class="bi bi-calendar3"></i>

                    <input
                        type="date"
                        id="datum"
                    >

                </div>

            </div>

            <div class="mezo-blokk">

                <label for="ido">
                    IDŐPONT RÖGZÍTÉS
                </label>

                <div class="input-keret">

                    <i class="bi bi-clock"></i>

                    <input
                        type="time"
                        id="ido"
                    >

                </div>

            </div>

        </div>

        <button id="hozzaad" type="button">

            <i class="bi bi-calendar-plus"></i>

            <span>
                Időpont hozzáadása
            </span>

        </button>

    </section>

    <section class="kivalasztott-resz">

        <h2>
            Kiválasztott időpontok
        </h2>

        <div id="kivalasztottLista">

            <div class="ures-kivalasztott">
                <i class="bi bi-calendar3"></i>
                <span>Még nincs kiválasztott időpont.</span>
            </div>

        </div>

        <button
            id="kuldes"
            class="vegleges-mentes"
            type="button"
        >

            <i class="bi bi-check2"></i>

            <span>
                Mentés
            </span>

        </button>

        <div class="push-szamlalo-resz">

            <span class="push-vonal"></span>

            <p id="pushUsage">
                Havi push értesítések: – / 25
            </p>

            <span class="push-vonal"></span>

        </div>

    </section>

    <section class="admin-lista">

        <h2>
            Felvitt időpontok
        </h2>

        <div id="adminIdopontLista"></div>

    </section>

    <div class="lotusz">
        <span></span>
        <div>♧</div>
        <span></span>
    </div>

</main>

<script type="module">
    import("./felszabadult-idopontok-adminoldal.js?v=" + Date.now());
</script>

</body>
</html>
