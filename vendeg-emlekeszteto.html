<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akciók</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.12.1/font/bootstrap-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendeg-emlekeszteto.css?v=2">
</head>
<body>


<header class="luxoria-header">
<a href="index.html" class="home-button"><i class="bi bi-house"></i>FŐOLDAL</a>
<button class="profile-button" type="button" aria-label="Profil"><i class="bi bi-person"></i></button>
</header>

<main class="appointment-page">
<section class="appointment-section">

<div class="section-heading">
<h1>IDŐPONT<br>RÖGZÍTÉSE</h1>
<span class="gold-line"></span>
<p>A már megbeszélt időpontodat rögzítsd.</p>
</div>

<form id="appointmentForm" class="appointment-form">
<div class="form-group">
<label for="guestName"><i class="bi bi-person"></i>Név</label>
<input id="guestName"
type="text"
placeholder="Teljes neved" 
autocomplete="off"
autocorrect="off"
spellcheck="false"
maxlength="80" 
required>
</div>

<div class="form-group">
<label for="appointmentDate"><i class="bi bi-calendar3"></i>Dátum</label>
<input id="appointmentDate" 
type="date" 
required>
</div>

<div class="form-group">
<label for="appointmentTime"><i class="bi bi-clock"></i>Időpont</label>
<input id="appointmentTime" 
type="time" 
required>
</div>

<button id="saveButton" class="save-button" type="submit">
<i class="bi bi-calendar2-plus"></i>
<span>IDŐPONT RÖGZÍTÉSE</span>
</button>
</form>

<div class="info-box">
<i class="bi bi-info-circle"></i>
<p>Csak a szolgáltatóval már egyeztetett időpontodat rögzítsd.</p>
</div>

<div id="successMessage" class="message success-message">
<i class="bi bi-check-circle"></i>
<div class="message-text">
<strong>Időpont rögzítve</strong>
<span id="savedAppointment"></span>
</div>
<button id="deleteAppointment" class="delete-appointment" type="button" aria-label="Időpont törlése" title="Időpont törlése">
<i class="bi bi-x-lg"></i>
</button>
</div>

<div id="errorMessage" class="message error-message">
<i class="bi bi-exclamation-circle"></i>
<div class="message-text">
<strong>Nem sikerült a művelet</strong>
<span id="errorText">Kérlek, próbáld újra.</span>
</div>
</div>

</section>
</main>


<script type="module" src="vendeg-emlekeszteto.js?v=3"></script>

</body>
</html>
