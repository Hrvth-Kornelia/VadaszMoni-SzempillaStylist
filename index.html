<script>
const profilePhoto=document.getElementById("profilePhoto");
const profilePhotoBox=document.querySelector(".profile-photo");

function showProfilePhoto(){
if(!profilePhoto||!profilePhotoBox)return;
profilePhoto.classList.add("loaded");
profilePhotoBox.classList.add("is-loaded");
}

if(profilePhoto){
if(profilePhoto.complete&&profilePhoto.naturalWidth>0){
showProfilePhoto();
}else{
profilePhoto.addEventListener("load",showProfilePhoto,{once:true});
}
}
</script>

<script>
const shareButton=document.getElementById("shareButton");

if(shareButton){
shareButton.addEventListener("click",async()=>{
try{
if(navigator.share){
await navigator.share({
title:"Luxória Beauty Art",
text:"Vadász Mónika – Szempilla & Szemöldök Stylist",
url:window.location.href
});
}else{
await navigator.clipboard.writeText(window.location.href);
alert("A linket kimásoltuk.");
}
}catch(error){
console.log("A megosztás megszakadt.");
}
});
}
</script>
